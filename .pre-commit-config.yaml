# https://pre-commit.com
#
# Install (automated on clone via scripts/setup_local_mcp.sh or manual):
#   ./scripts/setup_git_hooks.sh
#   # or: poetry run pre-commit install
#
# On each `git commit`: ruff check + pytest (tests/).
# Optional second hook file for push-only re-check:
#   poetry run pre-commit install --hook-type pre-push
#
# Run manually:
#   poetry run pre-commit run --all-files
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (full tree)
        entry: poetry run ruff check .
        language: system
        pass_filenames: false
        always_run: true

      - id: pytest
        name: pytest (tests/)
        entry: bash scripts/run_tests.sh --no-cov -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]
