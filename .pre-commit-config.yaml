# https://pre-commit.com
#
# Requires pre-commit >= 3.2. Installed via Poetry dev deps.
#
# Install (automated on clone via scripts/setup_local_mcp.sh or manual):
#   ./scripts/setup_git_hooks.sh
#   # or: poetry run pre-commit install
#
# On each `git commit`: ruff check, mypy, pytest (tests/), and CodeQL Python
# security (`scripts/run_codeql.sh`). CodeQL CLI is **required** by default
# (install: ./scripts/install_codeql_cli.sh). Set CODEQL_SKIP=1 to skip once, or
# CODEQL_REQUIRED=0 to allow a missing CLI. CI also runs .github/workflows/codeql.yml.
#
# Run manually:
#   poetry run pre-commit run --all-files
#   ./scripts/run_codeql.sh
minimum_pre_commit_version: "3.2.0"

default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (full tree)
        entry: bash scripts/run_ruff.sh
        language: system
        pass_filenames: false
        always_run: true

      - id: mypy
        name: mypy (server/ entrypoints/ evals/)
        entry: bash scripts/run_mypy.sh
        language: system
        pass_filenames: false
        always_run: true

      - id: pytest
        name: pytest (tests/)
        entry: bash scripts/run_tests.sh --no-cov -q
        language: system
        pass_filenames: false
        always_run: true

      - id: codeql
        name: codeql (python security)
        entry: bash scripts/run_codeql.sh
        language: system
        pass_filenames: false
        always_run: true
