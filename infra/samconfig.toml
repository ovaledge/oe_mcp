# Optional local SAM defaults. For deploys, ./scripts/deploy.sh is recommended (ECR + parameters).
# See samconfig.toml.example for a fuller template.
version = 0.1

[default.build.parameters]
template = "infra/template.yaml"
use_container = true

[default.deploy.parameters]
stack_name = "oe-mcp"
resolve_s3 = true
s3_prefix = "oe-mcp"
region = "us-east-1"
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
