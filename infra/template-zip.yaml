AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: OvalEdge MCP Server — Remote MCP (Lambda ZIP package; same stack as template.yaml without container image)

Parameters:
  AuthMode:
    Type: String
    Default: remote
    AllowedValues:
      - remote
      - remote_credentials
    Description: >
      remote = OAuth/OIDC Bearer per request; remote_credentials = X-OvalEdge-Credentials or Token + Secret headers.
  OvalEdgeBaseUrl:
    Type: String
  OvalEdgeTokenExchangePath:
    Type: String
    Default: /api/user/token/generate
  OvalEdgeMaxRetries:
    Type: String
    Default: "3"
    AllowedPattern: "^[0-9]+$"
    Description: Max retries for outbound OvalEdge HTTP (integer as string for SAM schema compatibility).
  OAuthIssuer:
    Type: String
    Default: ""
    Description: >
      (AUTH_MODE=remote) Authorization Server issuer URL (must match JWT iss). Discovery loads
      /.well-known/openid-configuration or oauth-authorization-server under this base.
  OAuthAudience:
    Type: String
    Default: ""
    Description: (AUTH_MODE=remote) Resource identifier expected as access token aud claim
  OvalEdgeForwardIdpToken:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      If true, skip OvalEdge token/generate and forward the IdP access token to OvalEdge APIs.
  Environment:
    Type: String
    Default: prod
    AllowedValues: [dev, staging, prod]
  McpHttpStateless:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >
      Streamable HTTP stateless mode (default true for Lambda). Set false only if your MCP client
      requires GET /mcp (SSE); adds session state in the worker.
  LambdaArchitecture:
    Type: String
    Default: x86_64
    AllowedValues:
      - x86_64
      - arm64
    Description: >
      Lambda CPU architecture. For ZIP builds, SAM installs manylinux wheels matching this arch.
      Use arm64 on Graviton; build on arm64 or with --use-container so pip targets Linux.
  OvalEdgeHttpAuthScheme:
    Type: String
    Default: jwt
    Description: >
      Outbound OvalEdge API Authorization scheme (e.g. jwt, Bearer). Must match what
      /api/v1/mcp/** expects after token exchange.
  CredentialsCacheMaxEntries:
    Type: String
    Default: "10000"
    AllowedPattern: "^[0-9]+$"
    Description: >
      AUTH_MODE=remote_credentials only — max distinct credential-key JWT entries per Lambda
      instance (in-memory LRU).
  LambdaMemorySize:
    Type: Number
    Default: 1024
    MinValue: 512
    MaxValue: 10240
    Description: >
      Lambda memory (MB). Higher values add CPU and help large tool responses (lineage, docs search).
      HTTP API integration timeout remains 30s max.
  LambdaTimeout:
    Type: Number
    Default: 30
    MinValue: 10
    MaxValue: 30
    Description: >
      Lambda timeout (seconds). API Gateway HTTP API caps integration at 30s; values above 30
      have no effect on /mcp until a longer-timeout front end is used.

Globals:
  Function:
    Timeout: !Ref LambdaTimeout
    MemorySize: !Ref LambdaMemorySize
    Architectures:
      - !Ref LambdaArchitecture

Resources:
  OEMCPFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: python3.12
      BuildProperties:
        # Pip reads requirements.txt at CodeUri (repo root); that file includes infra/lambda-requirements.txt.
        # false = native pip (no Docker). Use `sam build --use-container` if wheels must match Amazon Linux.
        UseContainer: false
    Properties:
      # Physical name includes stack name so a ZIP stack (e.g. oe-mcp-zip) can coexist with the
      # image stack (template.yaml uses oe-mcp-${Environment}); duplicate names fail
      # AWS::EarlyValidation::ResourceExistenceCheck in the same region.
      FunctionName: !Sub "${AWS::StackName}-${Environment}-lambda"
      Handler: entrypoints.lambda_handler.handler
      Runtime: python3.12
      CodeUri: ../
      Tags:
        Application: oe-mcp
        Component: mcp-server
        ManagedBy: SAM
      Environment:
        Variables:
          AUTH_MODE: !Ref AuthMode
          OVALEDGE_BASE_URL: !Ref OvalEdgeBaseUrl
          OVALEDGE_TOKEN_EXCHANGE_PATH: !Ref OvalEdgeTokenExchangePath
          OVALEDGE_MAX_RETRIES: !Ref OvalEdgeMaxRetries
          OAUTH_ISSUER: !Ref OAuthIssuer
          OAUTH_AUDIENCE: !Ref OAuthAudience
          OVALEDGE_REMOTE_FORWARD_IDP_TOKEN: !Ref OvalEdgeForwardIdpToken
          OVALEDGE_HTTP_AUTH_SCHEME: !Ref OvalEdgeHttpAuthScheme
          CREDENTIALS_CACHE_MAX_ENTRIES: !Ref CredentialsCacheMaxEntries
          MCP_HTTP_STATELESS: !Ref McpHttpStateless
      Events:
        MCPPost:
          Type: HttpApi
          Properties:
            Path: /mcp
            Method: POST
            ApiId: !Ref MCPApi
        MCPGet:
          Type: HttpApi
          Properties:
            Path: /mcp
            Method: GET
            ApiId: !Ref MCPApi
        OAuthDiscovery:
          Type: HttpApi
          Properties:
            Path: /.well-known/oauth-authorization-server
            Method: GET
            ApiId: !Ref MCPApi
        OIDCDiscovery:
          Type: HttpApi
          Properties:
            Path: /.well-known/openid-configuration
            Method: GET
            ApiId: !Ref MCPApi
        OAuthProtectedResource:
          Type: HttpApi
          Properties:
            Path: /.well-known/oauth-protected-resource
            Method: GET
            ApiId: !Ref MCPApi
        OAuthProtectedResourceMcp:
          Type: HttpApi
          Properties:
            Path: /.well-known/oauth-protected-resource/mcp
            Method: GET
            ApiId: !Ref MCPApi
        McpAuthDeclinedGet:
          Type: HttpApi
          Properties:
            Path: /mcp-auth/declined
            Method: GET
            ApiId: !Ref MCPApi
        McpAuthDeclinedPost:
          Type: HttpApi
          Properties:
            Path: /mcp-auth/declined
            Method: POST
            ApiId: !Ref MCPApi
        McpAuthDeclinedOptions:
          Type: HttpApi
          Properties:
            Path: /mcp-auth/declined
            Method: OPTIONS
            ApiId: !Ref MCPApi
        ClientRegistration:
          Type: HttpApi
          Properties:
            Path: /register
            Method: POST
            ApiId: !Ref MCPApi
        HealthCheck:
          Type: HttpApi
          Properties:
            Path: /health
            Method: GET
            ApiId: !Ref MCPApi
        BrandIcon:
          Type: HttpApi
          Properties:
            Path: /brand/ovaledge-mcp-icon.png
            Method: GET
            ApiId: !Ref MCPApi

  MCPApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: !Sub "${AWS::StackName}-${Environment}-httpapi"
      StageName: $default
      DefaultRouteSettings:
        ThrottlingBurstLimit: 200
        ThrottlingRateLimit: 100
      CorsConfiguration:
        AllowOrigins:
          - "https://claude.ai"
          - "https://cursor.sh"
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
          - X-OvalEdge-Credentials
          - X-OvalEdge-Token
          - X-OvalEdge-Secret
      RouteSettings:
        "POST /mcp":
          ThrottlingBurstLimit: 100
          ThrottlingRateLimit: 50
        "POST /register":
          ThrottlingBurstLimit: 10
          ThrottlingRateLimit: 5

Outputs:
  MCPEndpointUrl:
    Description: Remote MCP endpoint
    Value: !Sub
      - "https://${ApiId}.execute-api.${AWS::Region}.amazonaws.com/mcp"
      - ApiId: !Ref MCPApi
  OAuthDiscoveryUrl:
    Description: OAuth discovery endpoint
    Value: !Sub
      - "https://${ApiId}.execute-api.${AWS::Region}.amazonaws.com/.well-known/oauth-authorization-server"
      - ApiId: !Ref MCPApi
  HealthUrl:
    Description: Health check endpoint
    Value: !Sub
      - "https://${ApiId}.execute-api.${AWS::Region}.amazonaws.com/health"
      - ApiId: !Ref MCPApi
  MCPPublicBaseUrl:
    Description: >-
      Set as Lambda env MCP_PUBLIC_BASE_URL (no path suffix) so MCP initialize
      advertises the branding icon URL. Not injected automatically (CFN circular dep).
    Value: !Sub
      - "https://${ApiId}.execute-api.${AWS::Region}.amazonaws.com"
      - ApiId: !Ref MCPApi
  MCPBrandIconUrl:
    Description: Public MCP server icon (GET, no auth)
    Value: !Sub
      - "https://${ApiId}.execute-api.${AWS::Region}.amazonaws.com/brand/ovaledge-mcp-icon.png"
      - ApiId: !Ref MCPApi
