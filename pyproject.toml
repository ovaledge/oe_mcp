[tool.poetry]
name = "oe-mcp"
version = "2.0.0"
description = "OvalEdge MCP Server"
authors = ["Rohit Anand <rohit.anand@ovaledge.com>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "server" }, { include = "entrypoints" }, { include = "evals" }]

[tool.poetry.dependencies]
python = "^3.12"
fastmcp-slim = {version = "3.4.7", extras = ["client", "server"]}
fastapi = ">=0.111"
httpx = ">=0.27"
pydantic-settings = ">=2.0"
pydantic = ">=2.0"
joserfc = ">=1.7.0"
# Floor transitive crypto/ASN.1 stacks at patched releases (Dependabot / pip-audit).
cryptography = ">=50.0.0"
pyasn1 = ">=0.6.4"
mangum = ">=0.17"
tenacity = ">=8.2"
opentelemetry-api = ">=1.27"
opentelemetry-sdk = ">=1.27"
opentelemetry-exporter-otlp-proto-http = ">=1.27"

[tool.poetry.group.dev.dependencies]
pre-commit = ">=3.2.0"
pytest = "*"
pytest-asyncio = "*"
pytest-httpx = "*"
ruff = "*"
mypy = "*"
pytest-cov = "^7.1.0"


[tool.poetry.group.eval.dependencies]
deepeval = ">=3.9.9,<4.2.0"

[tool.poetry.scripts]
oe-mcp-local = "entrypoints.local:main"
oe-mcp-http = "entrypoints.http_local:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true

# fastmcp-slim 3.4+ (PR #58) lacks complete stubs for strict mypy on decorators.
[[tool.mypy.overrides]]
module = ["fastmcp", "fastmcp.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["opentelemetry", "opentelemetry.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["server.*", "entrypoints.*", "evals.*"]
disable_error_code = ["untyped-decorator", "import-untyped"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: live OvalEdge API tests (requires running server and .env credentials)",
]
filterwarnings = [
    "ignore:Please use `import python_multipart` instead.:PendingDeprecationWarning",
    "ignore:There is no current event loop:DeprecationWarning:deepeval.utils",
]
# Coverage is opt-in via scripts/run_tests.sh or explicit --cov flags (see README).
# Do not add --cov* to addopts: system pytest outside .venv would fail on Ubuntu/macOS.

[tool.coverage.run]
branch = true
source = ["server", "entrypoints"]
omit = [
    "*/tests/*",
    "*/evals/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]
show_missing = true
skip_covered = true
fail_under = 0

# basedpyright/pyright: use ./.venv for import resolution (poetry.toml: in-project venv).
[tool.pyright]
include = ["server", "tests", "entrypoints", "evals"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
