[tool.poetry]
name = "oe-mcp"
version = "1.0.0"
description = "OvalEdge MCP Server"
authors = ["Rohit Anand <rohit.anand@ovaledge.com>"]
readme = "README.md"
packages = [{ include = "server" }, { include = "entrypoints" }, { include = "evals" }]

[tool.poetry.dependencies]
python = "^3.12"
fastmcp = ">=2.5"
fastapi = ">=0.111"
httpx = ">=0.27"
pydantic-settings = ">=2.0"
pydantic = ">=2.0"
python-jose = {version = ">=3.3", extras = ["cryptography"]}
mangum = ">=0.17"
tenacity = ">=8.2"

[tool.poetry.group.dev.dependencies]
pre-commit = "*"
pytest = "*"
pytest-asyncio = "*"
pytest-httpx = "*"
ruff = "*"
mypy = "*"


[tool.poetry.group.eval.dependencies]
deepeval = "~3.9.9"

[tool.poetry.scripts]
oe-mcp-local = "entrypoints.local:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# basedpyright/pyright: use ./.venv for import resolution (poetry.toml: in-project venv).
[tool.pyright]
include = ["server", "tests", "entrypoints", "evals"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
